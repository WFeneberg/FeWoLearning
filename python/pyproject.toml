# Without a [build-system] table, `pip install -e ".[dev]"` — the command the
# README documents — falls back to setuptools' unpinned legacy backend.
[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fewolearning-python"
version = "0.1.0"
description = "Python skills-training exercises"
requires-python = ">=3.12"

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5", "mypy>=1.10"]

# There is no importable package here — exercises are loaded via pytest's
# `pythonpath` below — so tell setuptools not to go looking for one.
[tool.setuptools]
packages = []

[tool.pytest.ini_options]
testpaths = ["exercises"]
python_files = ["test_*.py"]
pythonpath = [
  "exercises/01-beginner",
  "exercises/02-intermediate",
  "exercises/03-advanced",
  "exercises/04-expert",
]

[tool.ruff]
line-length = 100

[tool.mypy]
python_version = "3.12"
strict = true
